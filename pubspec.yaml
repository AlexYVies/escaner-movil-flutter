name: escaner
description: App Flutter para capturar, recortar, reordenar y guardar fotos como PDF sin perder calidad.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.0
  image_cropper: ^11.0.0
  pdf: ^3.11.3
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  file_saver: ^0.2.12
  file_selector: ^1.0.4
  open_filex: ^4.4.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png         
  adaptive_icon_background: "#FFFFFF"           
  adaptive_icon_foreground: assets/icons/app_icon.png
